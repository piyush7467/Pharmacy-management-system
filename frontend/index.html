<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PharmaFlow — Pharmacy Management System</title>
    <!-- Prevent theme flicker before React hydration -->
    <script>
      (function() {
        try {
          const persisted = localStorage.getItem('persist:app-preferences');
          let isDark = false;
          if (persisted) {
            const parsed = JSON.parse(persisted);
            const theme = parsed.theme ? JSON.parse(parsed.theme) : 'light';
            isDark = (theme === 'dark');
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body class="bg-surface-page text-text-primary antialiased min-h-screen selection:bg-brand-primary selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
